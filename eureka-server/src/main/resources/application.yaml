spring:
  application:
    name: eureka-server
  config:
    activate:
      on-profile:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      fail-fast: true
      enabled: false
      uri: http://localhost:8888
server:
  port: 8761
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false