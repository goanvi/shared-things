spring:
  application:
    name: eureka-server
  cloud:
    config:
      fail-fast: true
      enabled: false
      uri: http://localhost:8888
server:
  port: ${SERVER_PORT:8761}
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
