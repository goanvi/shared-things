spring:
  application:
    name: auth-service
  r2dbc:
    url: r2dbc:postgresql://localhost:5434/postgres
    username: postgres
    password: postgres
    data:
      web:
        pageable:
          max-page-size: 50

server:
  port: 8005

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    preferIpAddress: true

logging:
  level:
    sql: warn
    web: warn