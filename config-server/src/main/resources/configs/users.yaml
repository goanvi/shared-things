
spring:
  application:
    name: users
  datasource:
    url: jdbc:postgresql://localhost:5434/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    data:
      web:
        pageable:
          max-page-size: 50

  server:
    port: 8007

  eureka:
    client:
      service-url:
        defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    instance:
      preferIpAddress: true

  logging:
    level:
      sql: debug
      web: debug