spring:
  application:
    name: monolith
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    web:
      pageable:
        max-page-size: 50
  config:
    activate:
      on-profile:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      fail-fast: true
      enabled: false
server:
  port: 8000
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    sql: warn
    web: warn

